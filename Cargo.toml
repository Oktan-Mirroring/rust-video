[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.87"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Bench holds realtime only against optimized assembly.
[profile.dev.package.openh264-sys2]
opt-level = 2

# d3d12's pure-Rust overlap pump wins under optimization; every other
# tier measures noise-or-worse there, so codegen stays scoped here.
# Thin LTO would add the other half of the d3d12 win but cannot scope
# per package, and d3d11 AV1 reads -6% under it: rejected, revisit if
# either side moves.
[profile.test.package.rust-video-d3d12]
opt-level = 3
codegen-units = 1
