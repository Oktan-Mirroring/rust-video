[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.87"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Bench holds realtime only against optimized assembly.
[profile.dev.package.openh264-sys2]
opt-level = 2
