[package]
name = "rust-video-d3d11"
description = "Direct3D 11 video tier behind the rust-video facade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_DirectShow", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
# Direct name for `windows_core::` paths in `#[implement]` expansions.
windows-core = "0.62.2"

[dependencies]
bytes = "1"
rust-video-av1 = { version = "0.1.0", path = "../rust-video-av1" }
rust-video-caps = { version = "0.1.0", path = "../rust-video-caps" }
rust-video-h264 = { version = "0.1.0", path = "../rust-video-h264" }
rust-video-h265 = { version = "0.1.0", path = "../rust-video-h265" }
rust-video-vp9 = { version = "0.1.0", path = "../rust-video-vp9" }
thiserror = "1"

[dev-dependencies]
rust-video-harness = { path = "../rust-video-harness" }

[[test]]
name = "throughput"
test = false
bench = true
