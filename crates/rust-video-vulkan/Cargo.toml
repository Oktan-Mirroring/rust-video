[package]
name = "rust-video-vulkan"
description = "Vulkan video tier with negotiation ladder and H.264/H.265/AV1 decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
bytes = "1"
log = "0"
memchr = "2"
rust-video-av1 = { version = "0.1.0", path = "../rust-video-av1" }
rust-video-caps = { version = "0.1.0", path = "../rust-video-caps" }
rust-video-h264 = { version = "0.1.0", path = "../rust-video-h264" }
rust-video-h265 = { version = "0.1.0", path = "../rust-video-h265" }
thiserror = "1"

[dev-dependencies]
rust-video = { path = "../rust-video" }
rust-video-harness = { path = "../rust-video-harness" }

[[test]]
name = "throughput"
test = false
bench = true
