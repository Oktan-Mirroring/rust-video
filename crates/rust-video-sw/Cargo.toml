[package]
name = "rust-video-sw"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Software CPU codec backends behind the rust-video facade"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[features]
default = []
ffmpeg = []
h264-openh264 = ["dep:openh264"]

[dependencies]
bytes = "1"
rust-video = { path = "../rust-video" }
rust-video-caps = { path = "../rust-video-caps" }
openh264 = { version = "0.9", optional = true }

[dev-dependencies]
rust-video-harness = { path = "../rust-video-harness" }
