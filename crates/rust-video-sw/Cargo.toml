[package]
name = "rust-video-sw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Software CPU codec backends behind the rust-video facade"

[lints]
workspace = true

[features]
default = []
ffmpeg = []
# Enabling `gpl` links the GPL path (libx265 is GPL-2+, which flips the ffmpeg
# build GPL): the closed product ships the default LGPL-clean set, opt in only.
gpl = ["ffmpeg"]
h264-openh264 = ["dep:openh264"]

[dependencies]
bytes = "1"
rust-video-caps = { path = "../rust-video-caps" }
openh264 = { version = "0.9", optional = true }

[dev-dependencies]
rust-video = { path = "../rust-video" }
rust-video-harness = { path = "../rust-video-harness" }
