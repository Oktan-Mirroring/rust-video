[package]
name = "rust-video-mediacodec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Android MediaCodec video tier"

[lints]
workspace = true

[dependencies]
bytes = "1"
rust-video-caps = { version = "0.1.0", path = "../rust-video-caps" }
thiserror = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", default-features = false, features = ["media", "api-level-28"] }
ndk-sys = "0.6.0"
